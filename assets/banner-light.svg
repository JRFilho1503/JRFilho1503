<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="José Roberto Benaglia — QA e Automação de Testes. Playwright, Pytest, Python e agentes de IA. Guarulhos, São Paulo, Brasil.">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eef2fb"/>
      <stop offset=".55" stop-color="#dde6f6"/>
      <stop offset="1" stop-color="#cdd9f0"/>
    </linearGradient>
    <radialGradient id="horizon" cx="78%" cy="92%" r="60%">
      <stop offset="0" stop-color="#2ea043" stop-opacity=".30"/>
      <stop offset="1" stop-color="#2ea043" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orbG" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#8af0c0"/>
      <stop offset=".4" stop-color="#39d0d8"/>
      <stop offset="1" stop-color="#1b7f6e"/>
    </radialGradient>
    <radialGradient id="orbHalo" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#39d0d8" stop-opacity=".5"/>
      <stop offset="1" stop-color="#39d0d8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2ea043"/><stop offset=".5" stop-color="#39d0d8"/><stop offset="1" stop-color="#2ea043"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="-1 0" to="1 0" dur="5s" repeatCount="indefinite"/>
    </linearGradient>
    <style>
      .name{font:700 56px Georgia,'Times New Roman',serif;fill:#2a2250}
      .sub{font:600 23px 'Segoe UI',Helvetica,Arial,sans-serif;fill:#1f2328}
      .sub2{font:400 20px 'Segoe UI',Helvetica,Arial,sans-serif;fill:#4a5568}
      .loc{font:400 16px 'Segoe UI',Helvetica,Arial,sans-serif;fill:#5a6b85}
      .star{fill:#3a4a78}
    </style>
  </defs>

  <!-- céu -->
  <rect width="1200" height="320" rx="18" fill="url(#sky)"/>
  <rect width="1200" height="320" rx="18" fill="url(#horizon)"/>

  <!-- estrelas piscando -->
  <g class="star">
    <circle cx="760" cy="48" r="1.6"><animate attributeName="opacity" values=".2;1;.2" dur="3s" begin="0s" repeatCount="indefinite"/></circle>
    <circle cx="840" cy="30" r="1.2"><animate attributeName="opacity" values=".2;1;.2" dur="4s" begin=".6s" repeatCount="indefinite"/></circle>
    <circle cx="910" cy="60" r="1.8"><animate attributeName="opacity" values=".2;1;.2" dur="3.4s" begin="1.1s" repeatCount="indefinite"/></circle>
    <circle cx="1000" cy="38" r="1.3"><animate attributeName="opacity" values=".2;1;.2" dur="3.8s" begin=".3s" repeatCount="indefinite"/></circle>
    <circle cx="1080" cy="150" r="1.5"><animate attributeName="opacity" values=".2;1;.2" dur="3.2s" begin="1.6s" repeatCount="indefinite"/></circle>
    <circle cx="1150" cy="70" r="1.4"><animate attributeName="opacity" values=".2;1;.2" dur="4.2s" begin=".9s" repeatCount="indefinite"/></circle>
    <circle cx="700" cy="90" r="1.2"><animate attributeName="opacity" values=".2;.9;.2" dur="3.6s" begin="2s" repeatCount="indefinite"/></circle>
    <circle cx="1130" cy="120" r="1.1"><animate attributeName="opacity" values=".2;.9;.2" dur="4s" begin="1.3s" repeatCount="indefinite"/></circle>
  </g>

  <!-- constelação em forma de ✓ (QA) -->
  <g>
    <polyline points="905,150 955,195 1075,70" fill="none" stroke="#39d0d8" stroke-opacity=".55" stroke-width="2" stroke-linecap="round" stroke-dasharray="320" stroke-dashoffset="320">
      <animate attributeName="stroke-dashoffset" values="320;0" dur="2.4s" begin=".4s" fill="freeze"/>
    </polyline>
    <g fill="#8af0c0">
      <circle cx="905" cy="150" r="3.5"><animate attributeName="r" values="3.5;4.6;3.5" dur="3s" repeatCount="indefinite"/></circle>
      <circle cx="955" cy="195" r="4.2"><animate attributeName="r" values="4.2;5.4;4.2" dur="3.4s" repeatCount="indefinite"/></circle>
      <circle cx="1015" cy="132" r="3"><animate attributeName="r" values="3;4;3" dur="2.6s" repeatCount="indefinite"/></circle>
      <circle cx="1075" cy="70" r="4"><animate attributeName="r" values="4;5.2;4" dur="3.2s" repeatCount="indefinite"/></circle>
    </g>
  </g>

  <!-- orbe / lua verde (CI pass) com halo pulsante -->
  <circle cx="1120" cy="200" r="70" fill="url(#orbHalo)">
    <animate attributeName="r" values="66;82;66" dur="5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1120" cy="200" r="30" fill="url(#orbG)"/>
  <circle cx="1110" cy="190" r="9" fill="#ffffff" opacity=".25"/>

  <!-- skyline de São Paulo (silhueta) + janelas piscando -->
  <g fill="#334066">
    <rect x="620" y="250" width="40" height="70"/><rect x="664" y="228" width="30" height="92"/>
    <rect x="700" y="262" width="46" height="58"/><rect x="752" y="236" width="26" height="84"/>
    <rect x="784" y="270" width="52" height="50"/><rect x="842" y="214" width="34" height="106"/>
    <rect x="880" y="252" width="40" height="68"/><rect x="926" y="240" width="28" height="80"/>
    <rect x="960" y="266" width="58" height="54"/><rect x="1022" y="222" width="30" height="98"/>
    <rect x="1058" y="258" width="44" height="62"/><rect x="1108" y="244" width="30" height="76"/><rect x="1144" y="264" width="40" height="56"/>
    <rect x="560" y="270" width="54" height="50"/><rect x="512" y="256" width="42" height="64"/>
  </g>
  <g fill="#39d0d8">
    <rect x="672" y="244" width="4" height="5" opacity=".7"><animate attributeName="opacity" values=".2;.8;.2" dur="4s" repeatCount="indefinite"/></rect>
    <rect x="850" y="230" width="4" height="5" opacity=".6"><animate attributeName="opacity" values=".2;.8;.2" dur="3.3s" begin="1s" repeatCount="indefinite"/></rect>
    <rect x="1030" y="238" width="4" height="5" opacity=".6"><animate attributeName="opacity" values=".2;.8;.2" dur="3.7s" begin=".5s" repeatCount="indefinite"/></rect>
  </g>
  <g fill="#ffcf56">
    <rect x="760" y="250" width="4" height="5" opacity=".6"><animate attributeName="opacity" values=".2;.9;.2" dur="3.9s" begin="1.4s" repeatCount="indefinite"/></rect>
    <rect x="936" y="254" width="4" height="5" opacity=".6"><animate attributeName="opacity" values=".2;.9;.2" dur="3.1s" begin=".7s" repeatCount="indefinite"/></rect>
  </g>

  <!-- textos -->
  <text x="60" y="118" class="name">José Roberto Benaglia</text>
  <rect x="62" y="138" width="300" height="4" rx="2" fill="url(#accent)"/>
  <text x="62" y="186" class="sub">QA &amp; Automação de Testes.</text>
  <text x="62" y="218" class="sub2">Playwright · Pytest · Python · agentes de IA.</text>
  <g transform="translate(62,262)">
    <path d="M7 0C3.1 0 0 3.1 0 7c0 5.2 7 11 7 11s7-5.8 7-11c0-3.9-3.1-7-7-7zm0 9.5A2.5 2.5 0 1 1 7 4.5a2.5 2.5 0 0 1 0 5z" fill="#5a6b85"/>
    <text x="22" y="15" class="loc">Guarulhos, São Paulo · Brasil</text>
  </g>
</svg>
