<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 180" width="1200" height="180" role="img" aria-label="Meu fluxo de QA: Reproduzir, Automatizar, CI, Analisar logs, Homologar, Evidência.">
  <defs>
    <linearGradient id="flow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2ea043"/><stop offset=".5" stop-color="#39d0d8"/><stop offset="1" stop-color="#2ea043"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="-1 0" to="1 0" dur="5s" repeatCount="indefinite"/>
    </linearGradient>
    <style>
      .card{fill:#f6f8fa;stroke:#d0d7de;stroke-width:1.5}
      .num{fill:#39d0d8;font:700 18px 'Segoe UI',Helvetica,Arial,sans-serif}
      .lbl{fill:#1f2328;font:700 17px 'Segoe UI',Helvetica,Arial,sans-serif}
      .sub{fill:#656d76;font:400 12.5px 'Segoe UI',Helvetica,Arial,sans-serif}
      .conn{stroke:#d0d7de;stroke-width:2.5;fill:none}
    </style>
  </defs>
  <rect width="1200" height="180" rx="16" fill="#ffffff"/>

  <!-- trilho de fundo + progresso animado -->
  <line x1="60" y1="60" x2="1140" y2="60" class="conn"/>
  <line x1="60" y1="60" x2="1140" y2="60" stroke="url(#flow)" stroke-width="3" stroke-dasharray="1080" stroke-dashoffset="1080" stroke-linecap="round">
    <animate attributeName="stroke-dashoffset" values="1080;0" dur="3s" fill="freeze"/>
  </line>

  <!-- 6 nós no trilho + comet -->
  <g>
    <circle cx="60"   cy="60" r="9" fill="#2ea043"/><circle cx="276" cy="60" r="9" fill="#2ea043"/>
    <circle cx="492"  cy="60" r="9" fill="#2ea043"/><circle cx="708" cy="60" r="9" fill="#2ea043"/>
    <circle cx="924"  cy="60" r="9" fill="#2ea043"/><circle cx="1140" cy="60" r="9" fill="#2ea043"/>
    <circle cx="60" cy="60" r="5" fill="#8af0c0"><animate attributeName="opacity" values="1;.3;1" dur="2s" repeatCount="indefinite"/></circle>
    <!-- comet correndo pelo trilho -->
    <circle r="6" fill="#8af0c0">
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.05;.95;1" dur="4s" repeatCount="indefinite"/>
      <animateMotion dur="4s" repeatCount="indefinite" path="M60,60 L1140,60"/>
    </circle>
  </g>

  <!-- rótulos dos passos -->
  <g text-anchor="middle">
    <text class="num" x="60"   y="100">1</text><text class="lbl" x="60"   y="124">Reproduzir</text><text class="sub" x="60"   y="144">bug + repro</text>
    <text class="num" x="276"  y="100">2</text><text class="lbl" x="276"  y="124">Automatizar</text><text class="sub" x="276"  y="144">Playwright · Pytest</text>
    <text class="num" x="492"  y="100">3</text><text class="lbl" x="492"  y="124">CI</text><text class="sub" x="492"  y="144">rodar em pipeline</text>
    <text class="num" x="708"  y="100">4</text><text class="lbl" x="708"  y="124">Analisar logs</text><text class="sub" x="708"  y="144">Grafana · Loki</text>
    <text class="num" x="924"  y="100">5</text><text class="lbl" x="924"  y="124">Homologar</text><text class="sub" x="924"  y="144">demo · critério aceite</text>
    <text class="num" x="1140" y="100">6</text><text class="lbl" x="1140" y="124">Evidência</text><text class="sub" x="1140" y="144">card no Jira</text>
  </g>
</svg>
